# Gera a versão da PLAY STORE: AAB assinado (para o Play Console) + APK assinado (para testar).
# Rodar em: Actions > Android Release (Play Store) > Run workflow.
#
# Secrets necessários (Settings > Secrets and variables > Actions > New repository secret):
#   ANDROID_KEYSTORE_BASE64    o arquivo .jks da chave de upload em base64
#   ANDROID_KEYSTORE_PASSWORD  senha do keystore
#   ANDROID_KEY_ALIAS          (opcional) alias da chave; padrão "upload"
#   ANDROID_KEY_PASSWORD       (opcional) senha da chave; padrão = senha do keystore
#   GOOGLE_SERVICES_JSON_BASE64 (opcional) google-services.json do Firebase em base64.
#                              Sem ele o AAB sai igual, só sem Firebase Analytics.
#
# Anúncios: usa os IDs REAIS de config/ads.json. Enquanto eles tiverem XXXX, o build
# falha – a menos que você marque "test_ads" (AAB com anúncios de TESTE, útil para o
# teste fechado antes de criar o app no AdMob).
# O versionCode é o número desta execução; o versionName vem do package.json.
name: Android Release (Play Store)

on:
  workflow_dispatch:
    inputs:
      test_ads:
        description: 'Usar anúncios de TESTE (só para teste fechado)'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TEST_ADS: ${{ inputs.test_ads && '1' || '0' }}
      VITE_TEST_ADS: ${{ inputs.test_ads && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Conferir secrets da assinatura
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Faltam os secrets ANDROID_KEYSTORE_BASE64 e/ou ANDROID_KEYSTORE_PASSWORD (veja o README)."
            exit 1
          fi
      - run: npm ci
      - name: Testes (motor, 300 fases com solver, anúncios, idiomas)
        run: npm test
      - name: Conferir IDs do AdMob
        run: npm run admob:sync:release
      - name: Build web (release)
        run: npm run build:release
      - run: npx cap sync android
      - name: Firebase – google-services.json (do secret, opcional)
        # Secret GOOGLE_SERVICES_JSON_BASE64 = conteúdo do google-services.json em base64.
        # Sem o secret o build continua (só sem analytics). O arquivo nunca vai para o git.
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::notice::Sem o secret GOOGLE_SERVICES_JSON_BASE64: build sem Firebase Analytics."
            exit 0
          fi
          echo "$GSJ" | base64 -d > android/app/google-services.json
          node -e "const j=require('./android/app/google-services.json');const ok=(j.client||[]).some(c=>c.client_info?.android_client_info?.package_name==='com.fsamplabs.buscrazypeople');if(!ok){console.error('::error::google-services.json não tem o app com.fsamplabs.buscrazypeople (baixe o arquivo do app Android certo no Firebase).');process.exit(1)}console.log('google-services.json OK (com.fsamplabs.buscrazypeople)')"
      - name: Preparar keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Compilar AAB e APK assinados
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME=$(node -p "require('../package.json').version")
          echo "Versão $VERSION_NAME (código = maior entre $VERSION_CODE e VERSION_CODE_MIN do android/app/build.gradle)"
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Organizar arquivos
        run: |
          V=$(node -p "require('./package.json').version")
          SUF=$([ "$TEST_ADS" = "1" ] && echo "-TESTADS" || echo "")
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/bus-crazy-people-$V-${{ github.run_number }}$SUF.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "out/bus-crazy-people-$V-${{ github.run_number }}$SUF.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: bus-crazy-people-release
          path: out/
          retention-days: 90
      - name: Apagar keystore e google-services.json temporários
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/google-services.json
