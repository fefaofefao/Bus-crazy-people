# Gera um APK de DEBUG a cada push (anúncios de TESTE do Google) e o disponibiliza
# como artefato: aba Actions > execução > Artifacts > bus-crazy-people-debug-apk.
name: Android APK (debug)

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Testes (motor, 300 fases com solver, anúncios, idiomas)
        run: npm test
      - run: npm run build
      - name: Copiar ID do AdMob (teste) para o Android
        run: npm run admob:sync
      - run: npx cap sync android
      - name: Firebase – google-services.json (do secret, opcional)
        # Secret GOOGLE_SERVICES_JSON_BASE64 = conteúdo do google-services.json em base64.
        # Sem o secret o build continua (só sem analytics). O arquivo nunca vai para o git.
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::notice::Sem o secret GOOGLE_SERVICES_JSON_BASE64: build sem Firebase Analytics."
            exit 0
          fi
          echo "$GSJ" | base64 -d > android/app/google-services.json
          node -e "const j=require('./android/app/google-services.json');const ok=(j.client||[]).some(c=>c.client_info?.android_client_info?.package_name==='com.fsamplabs.buscrazypeople');if(!ok){console.error('::error::google-services.json não tem o app com.fsamplabs.buscrazypeople (baixe o arquivo do app Android certo no Firebase).');process.exit(1)}console.log('google-services.json OK (com.fsamplabs.buscrazypeople)')"
      - name: Compilar APK de debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bus-crazy-people-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
