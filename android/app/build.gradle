apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Versão e assinatura de release (Play Store)
//   VERSION_CODE / VERSION_NAME   -> definidos pelo workflow android-release.yml
//   ANDROID_KEYSTORE_PATH         -> caminho do .jks (upload key)
//   ANDROID_KEYSTORE_PASSWORD     -> senha do keystore (e da chave)
//   ANDROID_KEY_ALIAS             -> alias da chave (padrão: upload)
// A chave NUNCA fica no repositório: no GitHub ela vem dos Secrets.
// ---------------------------------------------------------------------------
def env = System.getenv()
def releaseKeystore = env['ANDROID_KEYSTORE_PATH']
// versionCode: o maior entre o número da execução do CI (VERSION_CODE) e o mínimo desta
// versão do código (VERSION_CODE_MIN). Suba o mínimo a cada versão enviada à Play.
def VERSION_CODE_MIN = 4
def appVersionCode = Math.max((env['VERSION_CODE'] ?: '0') as Integer, VERSION_CODE_MIN)
def appVersionName = env['VERSION_NAME'] ?: '0.7.1'

// applicationId DEFINITIVO: com.fsamplabs.buscrazypeople (a Play Store não permite trocar depois do 1º envio)
android {
    namespace = "com.fsamplabs.buscrazypeople"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fsamplabs.buscrazypeople"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword env['ANDROID_KEYSTORE_PASSWORD']
                keyAlias env['ANDROID_KEY_ALIAS'] ?: 'upload'
                keyPassword env['ANDROID_KEY_PASSWORD'] ?: env['ANDROID_KEYSTORE_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion" // EdgeToEdge (MainActivity)
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase (Analytics): o plugin google-services só é aplicado se android/app/google-services.json
// existir. Sem o arquivo o build NÃO quebra: o app funciona igual, só sem enviar analytics.
// No CI o arquivo vem do secret GOOGLE_SERVICES_JSON_BASE64 (ver .github/workflows). Nunca commitar.
def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.text?.trim()) {
    apply plugin: 'com.google.gms.google-services'
    logger.lifecycle("google-services.json encontrado: Firebase Analytics ativo")
} else {
    logger.lifecycle("google-services.json ausente: build sem Firebase Analytics (o app funciona normalmente)")
}
